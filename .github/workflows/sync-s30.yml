name: One-shot S30 closure sync

on:
  push:
    branches:
      - sync/s30-harmonic-narrative-closure

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: skills/code-composer/kit/src
      PAYLOAD_SHA256: f45a59044f211adc96785112b6a3673feb49d63424f1cd09ac75212a559e30c9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify S30-only payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/s30-sync/payload
          tr -d '\r\n' < .sync-s30/s30-only.b64 | base64 --decode > /tmp/s30-sync/payload.tar.gz
          echo "${PAYLOAD_SHA256}  /tmp/s30-sync/payload.tar.gz" | sha256sum -c -
          tar -xzf /tmp/s30-sync/payload.tar.gz -C /tmp/s30-sync/payload
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('/tmp/s30-sync/payload')
          m=json.loads((root/'.sync-meta/manifest.json').read_text())
          expected=sorted(x['path'] for x in m)
          actual=sorted(str(p.relative_to(root)) for p in root.rglob('*') if p.is_file() and '.sync-meta' not in p.parts)
          assert actual==expected, (actual, expected)
          assert len(expected)==17
          PY

      - name: Apply S30-only files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, shutil
          src=pathlib.Path('/tmp/s30-sync/payload')
          repo=pathlib.Path('.')
          m=json.loads((src/'.sync-meta/manifest.json').read_text())
          for item in m:
              p=item['path']
              dst=repo/p
              dst.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(src/p,dst)
          PY
          rm -rf .sync-s30
          rm -f .github/workflows/sync-s30.yml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==2.2.6" "scipy==1.15.3" "pytest>=8" "jsonschema>=4.20"

      - name: Validate S30 closure candidate
        shell: bash
        run: |
          set -euo pipefail
          python skills/code-composer/kit/scripts/self_check.py
          python tools/validate_skill.py
          python tools/verify_plugin_distribution.py
          python -m compileall -q skills/code-composer/kit/src
          pytest -q tests/test_s30_harmonic_narrative.py tests/test_s29_thematic_arc.py tests/test_s15_ensemble_interaction.py tests/test_s27m_r2_ensemble_production_integration.py

      - name: Clean validation residue
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist build .pytest_cache
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

      - name: Verify staged diff scope
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          python - <<'PY'
          import json, pathlib, subprocess
          m=json.loads(pathlib.Path('/tmp/s30-sync/payload/.sync-meta/manifest.json').read_text())
          expected=sorted(x['path'] for x in m)
          changed=subprocess.check_output(['git','diff','--cached','--diff-filter=ACMRTUXB','--name-only'],text=True).splitlines()
          deleted=subprocess.check_output(['git','diff','--cached','--diff-filter=D','--name-only'],text=True).splitlines()
          assert sorted(changed)==expected, {'changed':changed,'expected':expected}
          assert sorted(deleted)==sorted(['.github/workflows/sync-s30.yml','.sync-s30/s30-only.b64']), deleted
          PY
          test -z "$(git diff --cached --name-only | grep -E '(^|/)(dist|build|__pycache__|\.pytest_cache)(/|$)|\.(wav|mid|midi|mp3|pyc)$' || true)"

      - name: Commit source-only S30 closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Close S30 harmonic narrative after perceptual PASS"
          git push origin HEAD:sync/s30-harmonic-narrative-closure
