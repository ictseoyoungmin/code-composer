name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      PYTHONPATH: skills/code-composer/kit/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==2.2.6" "scipy==1.15.3" "pytest>=8" "jsonschema>=4.20"
      - name: Skill self-check
        run: python skills/code-composer/kit/scripts/self_check.py
      - name: Validate canonical Skill
        run: python tools/validate_skill.py
      - name: Verify plugin distribution
        run: python tools/verify_plugin_distribution.py
      - name: Canonical byte-exact regression
        if: matrix.python-version == '3.10'
        run: pytest -q
      - name: Python 3.12 functional regression
        if: matrix.python-version == '3.12'
        run: >
          pytest -q
          -k "not test_s17_legacy_drum_path_is_byte_identical_to_s16_baseline
          and not test_s20_existing_modeled_kick_snare_closed_hat_are_byte_identical_to_s19
          and not test_s21_s20_preset_and_existing_default_hits_remain_byte_identical"
      - name: Python 3.12 known byte-exact probe (Issue #2)
        if: matrix.python-version == '3.12'
        continue-on-error: true
        run: >
          pytest -q
          tests/test_s17_percussion_acoustic_fidelity.py::test_s17_legacy_drum_path_is_byte_identical_to_s16_baseline
          tests/test_s20_drum_articulation_foundation.py::test_s20_existing_modeled_kick_snare_closed_hat_are_byte_identical_to_s19
          tests/test_s21_drum_acoustic_core_realism.py::test_s21_s20_preset_and_existing_default_hits_remain_byte_identical
      - name: Build release surfaces
        run: |
          python tools/build_skill.py
          python tools/build_plugins.py
