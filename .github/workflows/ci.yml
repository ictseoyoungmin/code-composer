name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checkout-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fresh clone remains clean with autocrlf=true
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git -c core.autocrlf=true clone --local "$GITHUB_WORKSPACE" "$tmp/repo"
          test -z "$(git -C "$tmp/repo" status --porcelain=v1)"
          git -C "$tmp/repo" add --renormalize .
          git -C "$tmp/repo" diff --cached --exit-code
          test "$(git -C "$tmp/repo" check-attr eol -- README.md | awk '{print $3}')" = "lf"

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      PYTHONPATH: skills/code-composer/kit/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==2.2.6" "scipy==1.15.3" "pytest>=8" "jsonschema>=4.20"
      - name: Skill self-check
        run: python skills/code-composer/kit/scripts/self_check.py
      - name: Validate canonical Skill
        run: python tools/validate_skill.py
      - name: Verify plugin distribution
        run: python tools/verify_plugin_distribution.py
      - name: Blocking regression
        run: >
          pytest -q
          -k "not test_s17_legacy_drum_path_is_byte_identical_to_s16_baseline
          and not test_s25_preserves_s19_legacy_core_byte_exactly
          and not test_s25_does_not_change_existing_s17_modeled_preset_hashes"
      - name: "Known runner-sensitive drum byte-exact probe (Issue #2)"
        continue-on-error: true
        run: >
          pytest -q
          tests/test_s17_percussion_acoustic_fidelity.py::test_s17_legacy_drum_path_is_byte_identical_to_s16_baseline
          tests/test_s25_s19_core_cymbal_extension.py::test_s25_preserves_s19_legacy_core_byte_exactly
          tests/test_s25_s19_core_cymbal_extension.py::test_s25_does_not_change_existing_s17_modeled_preset_hashes
      - name: Build release surfaces
        run: |
          python tools/build_skill.py
          python tools/build_plugins.py
