name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      PYTHONPATH: skills/code-composer/kit/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==2.2.6" "scipy==1.15.3" "pytest>=8" "jsonschema>=4.20"
      - name: Skill self-check
        run: python skills/code-composer/kit/scripts/self_check.py
      - name: Validate canonical Skill
        run: python tools/validate_skill.py
      - name: Full regression
        run: pytest -q
      - name: Build release surfaces
        run: |
          python tools/build_skill.py
          python tools/build_plugins.py
