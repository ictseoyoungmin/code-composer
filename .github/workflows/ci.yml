name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./skills/code-composer/kit[dev]"
      - name: Skill self-check
        run: python skills/code-composer/kit/scripts/self_check.py
      - name: Validate canonical Skill
        run: python tools/validate_skill.py
      - name: Full regression
        run: pytest -q
      - name: Build release surfaces
        run: |
          python tools/build_skill.py
          python tools/build_plugins.py
