name: AG08 S6 Passive Stability Evidence

on:
  pull_request:
    paths:
      - "skills/code-composer/kit/src/code_composer/audio/acoustic_guitar/**"
      - "skills/code-composer/kit/src/code_composer/audio/engines/acoustic_guitar.py"
      - "tests/test_ag08_stateful_s6.py"
      - "tools/render_ag08_s6_evidence.py"
      - ".github/workflows/ag08-s6-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stability-evidence:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: skills/code-composer/kit/src
      AG08_S6_EVIDENCE_DIR: artifacts/ag08-s6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==2.2.6" "scipy==1.15.3" pytest
      - name: Run AG08-S1-S6 focused tests
        run: python -m pytest -q tests/test_ag08_stateful_s1.py tests/test_ag08_stateful_s2.py tests/test_ag08_stateful_s3.py tests/test_ag08_stateful_s4.py tests/test_ag08_stateful_s5.py tests/test_ag08_stateful_s6.py
      - name: Run AG08-S6 stability evidence
        run: python tools/render_ag08_s6_evidence.py
      - name: Upload AG08-S6 evidence
        uses: actions/upload-artifact@v4
        with:
          name: ag08-s6-passive-stability-24k
          path: artifacts/ag08-s6
          if-no-files-found: error
