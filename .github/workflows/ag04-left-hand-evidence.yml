name: AG04 Left-Hand Evidence

on:
  pull_request:
    paths:
      - "skills/code-composer/kit/src/code_composer/audio/acoustic_guitar/**"
      - "skills/code-composer/kit/src/code_composer/audio/engines/acoustic_guitar.py"
      - "skills/code-composer/kit/src/code_composer/performance/guitar/**"
      - "skills/code-composer/kit/src/code_composer/performance/mechanics.py"
      - "tests/test_ag04_guitar_left_hand.py"
      - "tools/render_ag04_left_hand_evidence.py"
      - ".github/workflows/ag04-left-hand-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-evidence:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: skills/code-composer/kit/src
      AG04_EVIDENCE_DIR: artifacts/ag04-left-hand
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install render dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==2.2.6" "scipy==1.15.3"
      - name: Render AG04 evidence
        run: python tools/render_ag04_left_hand_evidence.py
      - name: Upload AG04 evidence
        uses: actions/upload-artifact@v4
        with:
          name: ag04-left-hand-24k
          path: artifacts/ag04-left-hand
          if-no-files-found: error
