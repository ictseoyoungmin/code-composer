name: AG09 D3 Public Domain Reference

on:
  push:
    branches:
      - ag09/production-closure
    paths:
      - "tools/render_ag09_d3_public_domain_reference.py"
      - "tests/test_ag09_d3_public_domain_reference.py"
      - ".github/workflows/ag09-d3-public-domain-reference.yml"
      - "CREDITS.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-domain-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: skills/code-composer/kit/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e skills/code-composer/kit
          python -m pip install pytest
      - name: Validate public-domain song contract
        run: python -m pytest -q tests/test_ag09_d3_public_domain_reference.py
      - name: Render 24 kHz reference reproduction
        run: python tools/render_ag09_d3_public_domain_reference.py --output dist/ag09-d3-public-domain-reference
      - name: Verify portable hashes
        working-directory: dist/ag09-d3-public-domain-reference
        run: sha256sum -c SHA256SUMS.txt
      - name: Upload listening evidence
        uses: actions/upload-artifact@v4
        with:
          name: ag09-d3-oh-susanna-public-domain-r0-24k
          path: dist/ag09-d3-public-domain-reference
          if-no-files-found: error
          retention-days: 30
