name: CR03 Piano Violin Dogfood

on:
  push:
    branches:
      - cr03-piano-violin-bottleneck
    paths:
      - "examples/cr03/**"
      - "tools/render_cr03_dogfood.py"
      - "tools/render_cr03_lantern_current.py"
      - "skills/code-composer/kit/src/code_composer/execution/**"
      - "skills/code-composer/kit/src/code_composer/app/song_cli.py"
      - "skills/code-composer/kit/schemas/performance_score.schema.json"
      - ".github/workflows/cr03-dogfood.yml"
  pull_request:
    branches:
      - main
    paths:
      - "examples/cr03/**"
      - "tools/render_cr03_dogfood.py"
      - "skills/code-composer/kit/src/code_composer/execution/**"
      - "skills/code-composer/kit/src/code_composer/app/song_cli.py"
      - "skills/code-composer/kit/schemas/performance_score.schema.json"
      - ".github/workflows/cr03-dogfood.yml"
  workflow_dispatch:

jobs:
  render-dogfood:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Code Composer
        run: python -m pip install -e skills/code-composer/kit
      - name: Render Quiet Thread at 24 kHz
        run: python tools/render_cr03_dogfood.py --output dist/cr03-quiet-thread
      - name: Render Lantern Current at 24 kHz
        run: python tools/render_cr03_lantern_current.py --output dist/cr03-lantern-current
      - name: Upload Quiet Thread evidence
        uses: actions/upload-artifact@v4
        with:
          name: cr03-quiet-thread
          path: dist/cr03-quiet-thread
          if-no-files-found: error
          retention-days: 30
      - name: Upload Lantern Current evidence
        uses: actions/upload-artifact@v4
        with:
          name: cr03-lantern-current
          path: dist/cr03-lantern-current
          if-no-files-found: error
          retention-days: 30
