name: Issue 2 Drum Byte Repro

on:
  push:
    branches: [issue-2-drum-byte-repro]
    paths:
      - 'tools/diagnose_drum_byte_repro.py'
      - '.github/workflows/issue2-drum-byte-repro.yml'
      - 'skills/code-composer/kit/src/code_composer/audio/percussion.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    env:
      PYTHONPATH: skills/code-composer/kit/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned numerical stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.2.6' 'scipy==1.15.3'
      - name: Capture byte-repro artifact
        env:
          DRUM_REPRO_OUT: dist/drum-byte-repro
        run: python tools/diagnose_drum_byte_repro.py
      - name: Upload exact float64 arrays and environment
        uses: actions/upload-artifact@v4
        with:
          name: drum-byte-repro-py${{ matrix.python-version }}
          path: dist/drum-byte-repro
          if-no-files-found: error
          retention-days: 14
