name: AG09 Percussive Fingerstyle Production Dogfood

on:
  push:
    branches:
      - ag09/production-closure
    paths:
      - "tools/render_ag09_percussive_fingerstyle_dogfood.py"
      - "tests/test_ag09_percussive_fingerstyle_dogfood.py"
      - ".github/workflows/ag09-percussive-fingerstyle-dogfood.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  percussive-fingerstyle-dogfood:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: skills/code-composer/kit/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e skills/code-composer/kit
          python -m pip install pytest
      - name: Validate D4 contract
        run: python -m pytest -q tests/test_ag09_percussive_fingerstyle_dogfood.py
      - name: Render 24 kHz D4 production candidate
        run: python tools/render_ag09_percussive_fingerstyle_dogfood.py --output dist/ag09-percussive-fingerstyle
      - name: Verify portable hashes
        working-directory: dist/ag09-percussive-fingerstyle
        run: sha256sum -c SHA256SUMS.txt
      - name: Upload listening evidence
        uses: actions/upload-artifact@v4
        with:
          name: ag09-d4-percussive-fingerstyle-r0-24k
          path: dist/ag09-percussive-fingerstyle
          if-no-files-found: error
          retention-days: 30
