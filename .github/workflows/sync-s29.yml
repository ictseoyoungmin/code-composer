name: One-shot S29 source sync

on:
  push:
    branches:
      - sync/s29-thematic-arc-closure

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: skills/code-composer/kit/src
      PAYLOAD_SHA256: 2ca0c2d3488f9ec0d1212bdca526df8ac42a3f4803dc0193928d25d929e129ec
      MANIFEST_SHA256: a4319c02521df987d9959f78d5a7d25d48ffc6781201aef289dc89c6eb3f5314
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify S29 payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/s29-sync
          cat .sync-s29/chunk-*.b64 | tr -d '\r\n' | base64 --decode > /tmp/s29-sync/payload.tar.gz
          echo "${PAYLOAD_SHA256}  /tmp/s29-sync/payload.tar.gz" | sha256sum -c -
          tar -xzf /tmp/s29-sync/payload.tar.gz -C /tmp/s29-sync
          cd /tmp/s29-sync/payload
          echo "${MANIFEST_SHA256}  .sync-meta/manifest.txt" | sha256sum -c -
          sort -u .sync-meta/manifest.txt > /tmp/s29-sync/manifest.lst
          find . -type f ! -path './.sync-meta/*' -printf '%P\n' | sort -u > /tmp/s29-sync/payload-files.lst
          diff -u /tmp/s29-sync/manifest.lst /tmp/s29-sync/payload-files.lst

      - name: Apply exact source manifest
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' path; do
            if ! grep -Fxq "$path" /tmp/s29-sync/manifest.lst; then
              rm -f -- "$path"
            fi
          done < <(git ls-files -z)
          rsync -a --delete --exclude='.git/' --exclude='.sync-meta/' /tmp/s29-sync/payload/ ./
          rm -rf .sync-s29
          rm -f .github/workflows/sync-s29.yml
          find . -path './.git' -prune -o -type f -printf '%P\n' | sort -u > /tmp/s29-sync/final-files.lst
          diff -u /tmp/s29-sync/manifest.lst /tmp/s29-sync/final-files.lst
          test -z "$(find . -type f \( -name '*.wav' -o -name '*.mid' -o -name '*.midi' -o -name '*.mp3' -o -name '*.pyc' \) -print -quit)"
          test -z "$(find . -type d \( -name '__pycache__' -o -name '.pytest_cache' -o -name 'dist' -o -name 'build' \) -print -quit)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==2.2.6" "scipy==1.15.3" "pytest>=8" "jsonschema>=4.20"

      - name: Validate S29 source
        shell: bash
        run: |
          set -euo pipefail
          python skills/code-composer/kit/scripts/self_check.py
          python tools/validate_skill.py
          python tools/verify_plugin_distribution.py
          python -m compileall -q skills/code-composer/kit/src
          pytest -q -k "not test_s17_legacy_drum_path_is_byte_identical_to_s16_baseline and not test_s25_preserves_s19_legacy_core_byte_exactly and not test_s25_does_not_change_existing_s17_modeled_preset_hashes"
          pytest -q tests/test_s17_percussion_acoustic_fidelity.py::test_s17_legacy_drum_path_is_byte_identical_to_s16_baseline tests/test_s25_s19_core_cymbal_extension.py::test_s25_preserves_s19_legacy_core_byte_exactly tests/test_s25_s19_core_cymbal_extension.py::test_s25_does_not_change_existing_s17_modeled_preset_hashes || true
          python tools/build_skill.py
          python tools/build_plugins.py

      - name: Clean generated validation residue
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist build .pytest_cache
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          find . -path './.git' -prune -o -type f -printf '%P\n' | sort -u > /tmp/s29-sync/final-clean-files.lst
          diff -u /tmp/s29-sync/manifest.lst /tmp/s29-sync/final-clean-files.lst
          test -z "$(find . -type f \( -name '*.wav' -o -name '*.mid' -o -name '*.midi' -o -name '*.mp3' -o -name '*.pyc' \) -print -quit)"

      - name: Commit source-only S29 sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Integrate S29 thematic arc after perceptual PASS"
          git push origin HEAD:sync/s29-thematic-arc-closure
