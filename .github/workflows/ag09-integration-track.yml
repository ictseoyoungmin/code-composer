name: AG09 D5 Integration Track

on:
  push:
    branches:
      - ag09/production-closure
    paths:
      - "tools/render_ag09_integration_track.py"
      - "tests/test_ag09_integration_track.py"
      - ".github/workflows/ag09-integration-track.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-track:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONPATH: skills/code-composer/kit/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e skills/code-composer/kit
          python -m pip install pytest
      - name: Validate D5 integration contracts
        run: python -m pytest -q tests/test_ag09_integration_track.py
      - name: Render 24 kHz integration candidate
        run: python tools/render_ag09_integration_track.py --output dist/ag09-integration-track
      - name: Verify portable hashes
        working-directory: dist/ag09-integration-track
        run: sha256sum -c SHA256SUMS.txt
      - name: Upload listening evidence
        uses: actions/upload-artifact@v4
        with:
          name: ag09-d5-integration-track-r0-24k
          path: dist/ag09-integration-track
          if-no-files-found: error
          retention-days: 30
