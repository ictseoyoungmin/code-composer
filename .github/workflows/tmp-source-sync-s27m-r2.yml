name: Temporary S27-M R2 source sync

on:
  push:
    branches:
      - sync/zip-first-through-s27m-r2
    paths:
      - ".sync-s27m-r2/source-sync-payload.b64"
      - ".github/workflows/tmp-source-sync-s27m-r2.yml"

permissions:
  contents: write

jobs:
  sync-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/zip-first-through-s27m-r2
          fetch-depth: 0

      - name: Reconstruct and verify payload
        shell: bash
        run: |
          set -euo pipefail
          tr -d '\n\r' < .sync-s27m-r2/source-sync-payload.b64 | base64 -d > /tmp/source-sync-payload.tar.gz
          echo "302796efda1b618a45b26ff4e192f359a0a12d29dd917c6408ddad4bd641c020  /tmp/source-sync-payload.tar.gz" | sha256sum -c -
          mkdir -p /tmp/source-sync
          tar -xzf /tmp/source-sync-payload.tar.gz -C /tmp/source-sync
          test -f /tmp/source-sync/payload/.sync-meta/manifest.txt
          test "$(find /tmp/source-sync/payload -type f | wc -l)" -eq 572
          grep -qx 'skills/code-composer/kit/src/code_composer/composition/ensemble_interaction.py' /tmp/source-sync/payload/.sync-meta/manifest.txt
          grep -qx 'tests/test_s27m_r2_ensemble_production_integration.py' /tmp/source-sync/payload/.sync-meta/manifest.txt
          grep -qx 'docs/history/slices/S28H_PIANO_NATURALISM_PRODUCTION_CLOSURE.md' /tmp/source-sync/payload/.sync-meta/manifest.txt

      - name: Replace repository with validated clean source snapshot
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete             --exclude='.git/'             /tmp/source-sync/payload/ ./
          rm -rf .sync-meta .sync-s27m-r2
          # The source snapshot intentionally contains only the canonical CI workflow.
          test -f .github/workflows/ci.yml
          test ! -e .github/workflows/tmp-source-sync-s27m-r2.yml

      - name: Safety gate before commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(find . -type f \( -name '*.wav' -o -name '*.mid' -o -name '*.midi' -o -name '*.mp3' \) | wc -l)" -eq 0
          test "$(find . -type d \( -name '__pycache__' -o -name '.pytest_cache' -o -name 'dist' -o -name 'build' \) | wc -l)" -eq 0
          python skills/code-composer/kit/scripts/self_check.py
          python tools/validate_skill.py
          python tools/verify_plugin_distribution.py
          python -m compileall -q skills/code-composer/kit/src
          find skills/code-composer/kit/src -type d -name '__pycache__' -prune -exec rm -rf {} +
          find skills/code-composer/kit/src -type f -name '*.pyc' -delete

      - name: Commit source snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git diff --cached --quiet && exit 0
          git commit -m "Sync ZIP-first development through S27-M R2"
          git push origin HEAD:sync/zip-first-through-s27m-r2
