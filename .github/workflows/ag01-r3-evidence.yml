name: AG01 R3 Evidence

on:
  pull_request:
    paths:
      - "skills/code-composer/kit/src/code_composer/audio/acoustic_guitar/**"
      - "skills/code-composer/kit/src/code_composer/audio/engines/acoustic_guitar.py"
      - "skills/code-composer/kit/src/code_composer/reference/presets/acoustic_guitar__steel_single_string__1.0.0.json"
      - "tests/test_ag01_acoustic_guitar_core.py"
      - "tools/render_ag01_r3_evidence.py"
      - ".github/workflows/ag01-r3-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-evidence:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: skills/code-composer/kit/src
      AG01_R3_EVIDENCE_DIR: artifacts/ag01-r3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install render dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==2.2.6" "scipy==1.15.3"
      - name: Render per-note AG01 R3 evidence
        run: python tools/render_ag01_r3_evidence.py
      - name: Upload AG01 R3 evidence
        uses: actions/upload-artifact@v4
        with:
          name: ag01-r3-per-note-24k
          path: artifacts/ag01-r3
          if-no-files-found: error
