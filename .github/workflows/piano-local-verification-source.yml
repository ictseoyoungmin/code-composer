name: Piano Offline Verification Source
on:
  pull_request:
    paths:
      - '.github/workflows/piano-local-verification-source.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: |
          git archive --format=tar HEAD | gzip -n > "$RUNNER_TEMP/piano-verification-source.tar.gz"
          sha256sum "$RUNNER_TEMP/piano-verification-source.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: piano-verification-source
          path: ${{ runner.temp }}/piano-verification-source.tar.gz
          retention-days: 1
