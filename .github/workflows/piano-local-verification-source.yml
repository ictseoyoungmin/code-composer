name: Piano Pinned Source Verification
on:
  pull_request:
    paths:
      - '.github/workflows/piano-local-verification-source.yml'
permissions:
  contents: read
jobs:
  verify-source:
    if: github.event.pull_request.number == 81 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/piano-unison-decay-envelope'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PYTHONPATH: skills/code-composer/kit/src
      OPENBLAS_NUM_THREADS: '1'
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install repository test dependencies
        run: python -m pip install 'numpy==2.2.6' 'scipy==1.15.3' 'pytest>=8' 'jsonschema>=4.20'
      - name: Reproduce exact locally tested source hashes
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python tools/_piano_focus_apply_once.py
          git rm tools/_piano_focus_apply_once.py
      - name: Full native verification before commit
        run: |
          python skills/code-composer/kit/scripts/self_check.py
          python tools/validate_skill.py
          python tools/verify_plugin_distribution.py
          python tools/verify_release_version.py
          python -m pytest -q
          python tools/build_skill.py
          python tools/build_plugins.py
      - name: Commit only verified source to existing PR branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/fix/piano-unison-decay-envelope | cut -f1)" = "$EXPECTED_HEAD"
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(piano): add verified explicit focused voicing and schema controls'
          git push origin HEAD:refs/heads/fix/piano-unison-decay-envelope
          git rev-parse HEAD
