name: AG08 S1 Stateful Bypass Evidence

on:
  pull_request:
    paths:
      - "skills/code-composer/kit/src/code_composer/audio/acoustic_guitar/**"
      - "skills/code-composer/kit/src/code_composer/audio/engines/acoustic_guitar.py"
      - "skills/code-composer/kit/src/code_composer/reference/presets/acoustic_guitar__steel_stateful__1.0.0.json"
      - "tests/test_ag08_stateful_s1.py"
      - "tools/render_ag08_s1_evidence.py"
      - ".github/workflows/ag08-s1-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preserve-ag07:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: skills/code-composer/kit/src
      AG08_S1_EVIDENCE_DIR: artifacts/ag08-s1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install render dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==2.2.6" "scipy==1.15.3"
      - name: Render AG08-S1 preservation evidence
        run: python tools/render_ag08_s1_evidence.py
      - name: Upload AG08-S1 evidence
        uses: actions/upload-artifact@v4
        with:
          name: ag08-s1-zero-coupling-24k
          path: artifacts/ag08-s1
          if-no-files-found: error
