name: Production Solo Acoustic Composition

on:
  push:
    branches: ["composition/cedar-rain-afterlight"]
    paths:
      - "tools/compose_cedar_rain_afterlight.py"
      - "tools/render_cedar_rain_afterlight_sections.py"
      - ".github/workflows/production-solo-acoustic-composition.yml"
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Code Composer
        run: python -m pip install -e skills/code-composer/kit
      - name: Static syntax check
        run: python -m py_compile tools/compose_cedar_rain_afterlight.py tools/render_cedar_rain_afterlight_sections.py
      - name: 48 kHz production master
        run: python tools/render_cedar_rain_afterlight_sections.py --output out/master48 --sample-rate 48000
      - name: Summarize metrics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('out/master48/metrics.json')
          d=json.loads(p.read_text())
          print(p)
          for k in ['duration_seconds','fixed_master_gain','peak','rms','clipped_sample_ratio','unique_bar_signatures','identical_four_bar_windows','authored_event_count','pitched_note_count','instrument_action_count','strum_note_count','right_hand_method_counts','left_hand_technique_counts','action_counts']:
              print(f"  {k}: {d[k]}")
          PY
      - name: Upload production package
        uses: actions/upload-artifact@v4
        with:
          name: cedar-rain-afterlight-production
          path: out/master48/**
          if-no-files-found: error
          retention-days: 30
