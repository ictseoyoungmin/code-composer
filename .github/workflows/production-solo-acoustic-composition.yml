name: Production Solo Acoustic Composition

on:
  push:
    branches: ["composition/cedar-rain-afterlight"]
    paths:
      - "tools/compose_cedar_rain_afterlight.py"
      - ".github/workflows/production-solo-acoustic-composition.yml"
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Code Composer
        run: python -m pip install -e .
      - name: Static syntax check
        run: python -m py_compile tools/compose_cedar_rain_afterlight.py
      - name: 24 kHz deterministic production check
        run: python tools/compose_cedar_rain_afterlight.py --output out/preview24 --sample-rate 24000 --repeat
      - name: 48 kHz production master
        run: python tools/compose_cedar_rain_afterlight.py --output out/master48 --sample-rate 48000
      - name: Summarize metrics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in [Path('out/preview24/metrics.json'), Path('out/master48/metrics.json')]:
              d=json.loads(p.read_text())
              print(p)
              for k in ['duration_seconds','peak','rms','clipped_sample_ratio','unique_bar_signatures','authored_event_count','render_ir_event_count','pitched_note_count','instrument_action_count','strum_note_count','right_hand_method_counts','action_counts','section_rms']:
                  print(f"  {k}: {d[k]}")
          PY
      - name: Upload production package
        uses: actions/upload-artifact@v4
        with:
          name: cedar-rain-afterlight-production
          path: |
            out/master48/**
            out/preview24/metrics.json
            out/preview24/01_cedar_rain_afterlight_24k.wav
          if-no-files-found: error
          retention-days: 30
