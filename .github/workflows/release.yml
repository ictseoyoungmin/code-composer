name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact CI-validated main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < skills/code-composer/VERSION)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check whether release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build tooling
        if: steps.existing.outputs.exists != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools>=68" wheel

      - name: Verify release surfaces
        if: steps.existing.outputs.exists != 'true'
        env:
          PYTHONPATH: skills/code-composer/kit/src
        run: |
          python tools/verify_release_version.py
          python skills/code-composer/kit/scripts/self_check.py
          python tools/validate_skill.py
          python tools/verify_plugin_distribution.py
          python -m compileall -q skills/code-composer/kit/src

      - name: Build release artifacts
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          python -m pip wheel skills/code-composer/kit --no-deps --no-build-isolation -w dist/
          python tools/build_skill.py
          python tools/build_plugins.py

      - name: Verify wheel version
        if: steps.existing.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          python -m venv "$tmp/venv"
          "$tmp/venv/bin/python" -m pip install --no-deps dist/code_composer-"$VERSION"-py3-none-any.whl
          EXPECTED_VERSION="$VERSION" "$tmp/venv/bin/python" - <<'PY'
          import importlib.metadata
          import os
          import code_composer
          expected = os.environ["EXPECTED_VERSION"]
          assert code_composer.__version__ == expected
          assert importlib.metadata.version("code-composer") == expected
          print("wheel version PASS", expected)
          PY

      - name: Write release provenance and checksums
        if: steps.existing.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          CI_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          version = os.environ["VERSION"]
          payload = {
              "schema": "code-composer-release/v1",
              "version": version,
              "tag": os.environ["TAG"],
              "validated_main_sha": os.environ["VALIDATED_SHA"],
              "ci_run_id": int(os.environ["CI_RUN_ID"]),
              "ci_run_number": int(os.environ["CI_RUN_NUMBER"]),
              "ci_conclusion": "success",
              "artifacts": [
                  f"code_composer-{version}-py3-none-any.whl",
                  f"code-composer-skill-v{version}.zip",
                  f"code-composer-codex-plugin-v{version}.zip",
                  f"code-composer-claude-plugin-v{version}.zip",
              ],
          }
          Path("dist/release-manifest.json").write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY
          (
            cd dist
            sha256sum \
              code_composer-"$VERSION"-py3-none-any.whl \
              code-composer-skill-v"$VERSION".zip \
              code-composer-codex-plugin-v"$VERSION".zip \
              code-composer-claude-plugin-v"$VERSION".zip \
              release-manifest.json \
              > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

      - name: Publish tag and GitHub Release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          notes="docs/releases/v$VERSION.md"
          test -f "$notes"
          gh release create "$TAG" \
            dist/code_composer-"$VERSION"-py3-none-any.whl \
            dist/code-composer-skill-v"$VERSION".zip \
            dist/code-composer-codex-plugin-v"$VERSION".zip \
            dist/code-composer-claude-plugin-v"$VERSION".zip \
            dist/release-manifest.json \
            dist/SHA256SUMS.txt \
            --target "$VALIDATED_SHA" \
            --title "Code Composer v$VERSION" \
            --notes-file "$notes"
