[project]
name = "code-composer"
dynamic = ["version"]
description = "Model-free deterministic music composition and rendering engine"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.scripts]
code-composer = "code_composer.app.cli:main"
code-composer-compose = "code_composer.app.composer_cli:main"
code-composer-midi = "code_composer.app.midi_cli:main"
code-composer-collab = "code_composer.app.collab_cli:main"
code-composer-exchange = "code_composer.app.exchange_cli:main"
code-composer-delivery = "code_composer.app.delivery_cli:main"
code-composer-presets = "code_composer.app.presets_cli:main"
code-composer-violin = "code_composer.app.violin_cli:main"
code-composer-admittance-fit = "code_composer.app.admittance_fit_cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.20"]

[tool.setuptools.package-data]
"code_composer.reference" = ["schemas/*.json"]
"code_composer.reference.presets" = ["*.json"]

[tool.setuptools.dynamic]
version = {attr = "code_composer.__version__"}
